name: Build Raspberry Pi 5 kernel (bcm2712)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      # Това е името на kernel файла за Pi 5 според официалната документация
      KERNEL: kernel_2712

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev make libc6-dev libncurses5-dev \
            crossbuild-essential-arm64 \
            ccache libelf-dev dwarves

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ env.ARCH }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.ARCH }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-${{ env.ARCH }}-

      - name: Configure (Pi 5 / CM5)
        run: |
          make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} bcm2712_defconfig

          # Добра практика: уникален LOCALVERSION, за да не се препокриват /lib/modules
          # (официалната документация препоръчва това)
          if grep -q '^CONFIG_LOCALVERSION=' .config; then
            sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-cm5-custom"/' .config
          else
            echo 'CONFIG_LOCALVERSION="-cm5-custom"' >> .config
          fi

          # По желание: да не добавя автоматични git суфикси
          if grep -q '^CONFIG_LOCALVERSION_AUTO=' .config; then
            sed -i 's/^CONFIG_LOCALVERSION_AUTO=.*/CONFIG_LOCALVERSION_AUTO=n/' .config
          else
            echo 'CONFIG_LOCALVERSION_AUTO=n' >> .config
          fi

          make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} olddefconfig

      - name: Build
        run: |
          export CC="ccache ${CROSS_COMPILE}gcc"
          ccache -M 2G
          make -j"$(nproc)" ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} Image.gz modules dtbs

      - name: Stage files into a rootfs-style tarball
        run: |
          rm -rf stage
          mkdir -p stage/boot/firmware/overlays

          # Инсталирай модулите така, че да отидат в stage/lib/modules/...
          sudo make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} \
            INSTALL_MOD_PATH="$PWD/stage" modules_install

          # Kernel + DTBs + overlays — по официалните стъпки за Raspberry Pi OS
          cp arch/arm64/boot/Image.gz "stage/boot/firmware/${KERNEL}.img"
          cp arch/arm64/boot/dts/broadcom/*.dtb stage/boot/firmware/
          cp arch/arm64/boot/dts/overlays/*.dtb* stage/boot/firmware/overlays/
          cp arch/arm64/boot/dts/overlays/README stage/boot/firmware/overlays/

          TAR="${KERNEL}-${GITHUB_SHA::7}.tar.gz"
          (cd stage && tar -czf "../${TAR}" .)
          sha256sum "${TAR}" > "${TAR}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpi5-kernel-${{ env.KERNEL }}-${{ github.sha }}
          path: |
            ${{ env.KERNEL }}-*.tar.gz
            ${{ env.KERNEL }}-*.tar.gz.sha256

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.KERNEL }}-*.tar.gz
            ${{ env.KERNEL }}-*.tar.gz.sha256

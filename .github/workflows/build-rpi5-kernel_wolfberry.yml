name: Build RPi5/CM5 kernel (.deb) for Wolfberry APT (suite-agnostic)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kernel-deb:
    runs-on: ubuntu-24.04

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      KERNEL_IMG_NAME: kernel_2712-wolfberry.img
      PKGNAME: rpi5-kernel-cm5-wolfberry

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps (cross compile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             bc bison flex make             libssl-dev libc6-dev libncurses-dev             libelf-dev dwarves             crossbuild-essential-arm64             dpkg-dev fakeroot gzip xz-utils             ca-certificates

      - name: Configure (bcm2712) + LOCALVERSION
        run: |
          set -e
          make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} bcm2712_defconfig

          # уникален суфикс, за да не се бие /lib/modules с други kernel-и
          if grep -q '^CONFIG_LOCALVERSION=' .config; then
            sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-wolfberry"/' .config
          else
            echo 'CONFIG_LOCALVERSION="-wolfberry"' >> .config
          fi

          # без auto git суфикси (по-стабилно за пакетиране)
          if grep -q '^CONFIG_LOCALVERSION_AUTO=' .config; then
            sed -i 's/^CONFIG_LOCALVERSION_AUTO=.*/CONFIG_LOCALVERSION_AUTO=n/' .config
          else
            echo 'CONFIG_LOCALVERSION_AUTO=n' >> .config
          fi

          make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} olddefconfig

      - name: Build kernel + modules + dtbs
        run: |
          set -e
          make -j"$(nproc)" ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} Image.gz modules dtbs
          KVER="$(make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} kernelrelease)"
          echo "KVER=${KVER}" >> "$GITHUB_ENV"
          echo "Kernel release: ${KVER}"

      - name: Build .deb package (kernel + modules + dtb/overlays)
        run: |
          set -e
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          VERSION="$(date -u +%Y%m%d%H%M)-g${SHORT_SHA}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          rm -rf pkg out
          mkdir -p pkg/DEBIAN
          mkdir -p "pkg/usr/lib/${PKGNAME}/${KVER}/dtb"
          mkdir -p "pkg/usr/lib/${PKGNAME}/${KVER}/overlays"

          # modules -> /lib/modules/<KVER> (вътре в пакета)
          fakeroot make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE}             INSTALL_MOD_PATH="$PWD/pkg" modules_install

          # kernel image + dtb/overlays се държат в /usr/lib/... и се копират към /boot/firmware в postinst
          install -m 0644 arch/arm64/boot/Image.gz "pkg/usr/lib/${PKGNAME}/${KVER}/${KERNEL_IMG_NAME}"
          cp arch/arm64/boot/dts/broadcom/*.dtb "pkg/usr/lib/${PKGNAME}/${KVER}/dtb/" 2>/dev/null || true
          cp arch/arm64/boot/dts/overlays/*.dtb* "pkg/usr/lib/${PKGNAME}/${KVER}/overlays/" 2>/dev/null || true
          cp arch/arm64/boot/dts/overlays/README "pkg/usr/lib/${PKGNAME}/${KVER}/overlays/" 2>/dev/null || true

          cat > pkg/DEBIAN/control <<EOF
          Package: ${PKGNAME}
          Version: ${VERSION}
          Section: kernel
          Priority: optional
          Architecture: arm64
          Maintainer: ${GITHUB_REPOSITORY} <hristoandreev@wolfberry.lz1haa.eu>
          Depends: libc6
          Description: Custom Raspberry Pi 5 / CM5 kernel (bcm2712) for Raspberry Pi OS
           Installs modules into /lib/modules and copies kernel/dtb/overlays to /boot/firmware in postinst.
          EOF

          cat > pkg/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          set -e

          PKGNAME="__PKGNAME__"
          KVER="__KVER__"
          KERNEL_IMG_NAME="__KERNEL_IMG_NAME__"

          SRC="/usr/lib/${PKGNAME}/${KVER}"
          BOOT="/boot/firmware"
          [ -d "$BOOT" ] || BOOT="/boot"

          mkdir -p "${BOOT}/overlays"

          # backup стария custom kernel (ако има)
          if [ -f "${BOOT}/${KERNEL_IMG_NAME}" ]; then
            cp -f "${BOOT}/${KERNEL_IMG_NAME}" "${BOOT}/${KERNEL_IMG_NAME}.bak" || true
          fi

          install -m 0644 "${SRC}/${KERNEL_IMG_NAME}" "${BOOT}/${KERNEL_IMG_NAME}"

          # dtb + overlays
          if [ -d "${SRC}/dtb" ]; then
            cp -f "${SRC}/dtb/"*.dtb "${BOOT}/" 2>/dev/null || true
          fi
          if [ -d "${SRC}/overlays" ]; then
            cp -f "${SRC}/overlays/"* "${BOOT}/overlays/" 2>/dev/null || true
          fi

          depmod -a "${KVER}" || true
          exit 0
          EOF

          sed -i "s/__PKGNAME__/${PKGNAME}/g" pkg/DEBIAN/postinst
          sed -i "s/__KVER__/${KVER}/g" pkg/DEBIAN/postinst
          sed -i "s/__KERNEL_IMG_NAME__/${KERNEL_IMG_NAME}/g" pkg/DEBIAN/postinst
          chmod 0755 pkg/DEBIAN/postinst

          mkdir -p out
          dpkg-deb --build pkg "out/${PKGNAME}_${VERSION}_arm64.deb"
          sha256sum "out/${PKGNAME}_${VERSION}_arm64.deb" > "out/${PKGNAME}_${VERSION}_arm64.deb.sha256"

      - name: Inspect produced .deb
        run: |
          set -e
          ls -lah out
          DEB="$(ls -1 out/*.deb | head -n1)"
          echo "DEB: $DEB"
          dpkg-deb -I "$DEB" | sed -n '1,160p'
          dpkg-deb -c "$DEB" | sed -n '1,120p'

      - name: Prepare artifact payload (common/)
        run: |
          set -e
          rm -rf common
          mkdir -p common
          cp -v out/*.deb common/
          cp -v out/*.sha256 common/ || true
          ls -lah common

      - name: Upload artifact (common for ALL suites)
        uses: actions/upload-artifact@v4
        with:
          name: apt-common-${{ env.ARCH }}
          path: common/
          if-no-files-found: error
          retention-days: 30

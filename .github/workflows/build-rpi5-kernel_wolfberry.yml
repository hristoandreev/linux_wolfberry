name: Pi5/CM5 kernel -> .deb + signed APT repo (GitHub Pages)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    environment:
      name: linux-wolfberry
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      # Файлът, който firmware ще зареди ако добавиш kernel=... в config.txt
      KERNEL_IMG_NAME: kernel_2712-wolfberry.img
      # Име на deb пакета
      PKGNAME: rpi5-kernel-cm5-wolfberry

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev make libc6-dev libncurses5-dev \
            crossbuild-essential-arm64 \
            libelf-dev dwarves \
            dpkg-dev apt-utils gnupg fakeroot gzip xz-utils

      - name: Configure (bcm2712) + unique LOCALVERSION
        run: |
          make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} bcm2712_defconfig

          # Уникален суфикс, за да не се бие /lib/modules с други kernel-и
          if grep -q '^CONFIG_LOCALVERSION=' .config; then
            sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-wolfberry"/' .config
          else
            echo 'CONFIG_LOCALVERSION="-wolfberry"' >> .config
          fi

          # Без auto git суфикси (по-стабилно за пакетиране)
          if grep -q '^CONFIG_LOCALVERSION_AUTO=' .config; then
            sed -i 's/^CONFIG_LOCALVERSION_AUTO=.*/CONFIG_LOCALVERSION_AUTO=n/' .config
          else
            echo 'CONFIG_LOCALVERSION_AUTO=n' >> .config
          fi

          make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} olddefconfig

      - name: Build kernel + modules + dtbs
        run: |
          make -j"$(nproc)" ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} Image.gz modules dtbs
          KVER="$(make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} kernelrelease)"
          echo "KVER=${KVER}" >> $GITHUB_ENV

      - name: Build .deb package
        run: |
          VERSION="$(date -u +%Y%m%d%H%M)-g${GITHUB_SHA::7}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

          rm -rf pkg
          mkdir -p pkg/DEBIAN
          mkdir -p pkg/usr/lib/${PKGNAME}/${KVER}/dtb
          mkdir -p pkg/usr/lib/${PKGNAME}/${KVER}/overlays

          # modules -> /lib/modules/<KVER> (вътре в пакета), с root ownership (fakeroot)
          fakeroot make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} \
            INSTALL_MOD_PATH="$PWD/pkg" modules_install

          # kernel image + dtb/overlays се държат в /usr/lib/... и се копират към /boot/firmware в postinst
          install -m 0644 arch/arm64/boot/Image.gz pkg/usr/lib/${PKGNAME}/${KVER}/${KERNEL_IMG_NAME}
          cp arch/arm64/boot/dts/broadcom/*.dtb pkg/usr/lib/${PKGNAME}/${KVER}/dtb/ || true
          cp arch/arm64/boot/dts/overlays/*.dtb* pkg/usr/lib/${PKGNAME}/${KVER}/overlays/ || true
          cp arch/arm64/boot/dts/overlays/README pkg/usr/lib/${PKGNAME}/${KVER}/overlays/ || true

          cat > pkg/DEBIAN/control <<EOF
          Package: ${PKGNAME}
          Version: ${VERSION}
          Section: kernel
          Priority: optional
          Architecture: arm64
          Maintainer: ${GITHUB_REPOSITORY} <hristoandreev@wolfberry.lz1haa.eu>
          Depends: libc6
          Description: Custom Raspberry Pi 5 / CM5 kernel (bcm2712) for Raspberry Pi OS
           Installs modules into /lib/modules and copies kernel/dtb/overlays to /boot/firmware in postinst.
          EOF

          cat > pkg/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          set -e

          PKGNAME="__PKGNAME__"
          KVER="__KVER__"
          KERNEL_IMG_NAME="__KERNEL_IMG_NAME__"
          SRC="/usr/lib/${PKGNAME}/${KVER}"
          BOOT="/boot/firmware"
          [ -d "$BOOT" ] || BOOT="/boot"

          mkdir -p "${BOOT}/overlays"

          # backup стария custom kernel (ако има)
          if [ -f "${BOOT}/${KERNEL_IMG_NAME}" ]; then
            cp -f "${BOOT}/${KERNEL_IMG_NAME}" "${BOOT}/${KERNEL_IMG_NAME}.bak" || true
          fi

          install -m 0644 "${SRC}/${KERNEL_IMG_NAME}" "${BOOT}/${KERNEL_IMG_NAME}"

          # dtb + overlays
          if [ -d "${SRC}/dtb" ]; then
            cp -f "${SRC}/dtb/"*.dtb "${BOOT}/" 2>/dev/null || true
          fi
          if [ -d "${SRC}/overlays" ]; then
            cp -f "${SRC}/overlays/"* "${BOOT}/overlays/" 2>/dev/null || true
          fi

          depmod -a "${KVER}" || true
          exit 0
          EOF

          sed -i "s/__PKGNAME__/${PKGNAME}/g" pkg/DEBIAN/postinst
          sed -i "s/__KVER__/${KVER}/g" pkg/DEBIAN/postinst
          sed -i "s/__KERNEL_IMG_NAME__/${KERNEL_IMG_NAME}/g" pkg/DEBIAN/postinst
          chmod 0755 pkg/DEBIAN/postinst

          mkdir -p out
          dpkg-deb --build pkg "out/${PKGNAME}_${VERSION}_arm64.deb"
          sha256sum "out/${PKGNAME}_${VERSION}_arm64.deb" > "out/${PKGNAME}_${VERSION}_arm64.deb.sha256"

      - name: Import signing key (base64)
        env:
          APT_GPG_PRIVATE_KEY_B64: ${{ secrets.APT_GPG_PRIVATE_KEY_B64 }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg

          # fail fast ако secret липсва
          if [ -z "$APT_GPG_PRIVATE_KEY_B64" ]; then
            echo "ERROR: Secret APT_GPG_PRIVATE_KEY_B64 is empty/missing."
            exit 1
          fi

          printf '%s' "$APT_GPG_PRIVATE_KEY_B64" | base64 -d | gpg --batch --import

          KEYID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')"
          if [ -z "$KEYID" ]; then
            echo "ERROR: No secret key imported (did you export *secret* keys?)."
            exit 1
          fi
          echo "SIGNING_KEYID=$KEYID" >> $GITHUB_ENV
          gpg --list-secret-keys --keyid-format=long

      - name: Build signed APT repo (flat) for Pages
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          rm -rf public
          mkdir -p public/pool

          # пакети
          cp -v out/*.deb public/pool/
          cp -v out/*.sha256 public/ || true

          # публикувай и публичния ключ (за клиента)
          cp -v cm5-wolfberry-kernel-repo.asc public/cm5-wolfberry-kernel-repo.asc

          cd public
          dpkg-scanpackages pool /dev/null > Packages
          gzip -9fk Packages

          # Release + подписи (InRelease и Release.gpg)
          apt-ftparchive release . > Release

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$APT_GPG_PASSPHRASE" \
            --default-key "$SIGNING_KEYID" \
            --digest-algo SHA256 \
            --clearsign -o InRelease Release

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$APT_GPG_PASSPHRASE" \
            --default-key "$SIGNING_KEYID" \
            --digest-algo SHA256 \
            -abs -o Release.gpg Release

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
